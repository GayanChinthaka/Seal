name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub release (creates the tag v<version>). Off: build the APKs only.'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as pre-release / beta'
        type: boolean
        default: false
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          VERSION=$(./gradlew -q :app:printVersionName --no-daemon | tail -n 1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version name from buildSrc/src/main/kotlin/Version.kt"
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match the app version $VERSION. Update Version.kt or push the tag v$VERSION."
              exit 1
            fi
            PUBLISH=true
          else
            TAG="v$VERSION"
            PUBLISH="${{ inputs.publish_release }}"
          fi

          echo "Version: $VERSION, tag: $TAG, publish: $PUBLISH"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            # Read by app/build.gradle.kts, storeFile is relative to the app module
            {
              echo "storeFile=../keystore/release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore set up."
          else
            echo "::warning::Signing secrets are not set. The APKs are signed with a temporary debug key and cannot update an installed release."
          fi

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release artifacts
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          mkdir -p release-apks
          find app/build/outputs/apk/release -type f -name "*.apk" | while read -r apk_path; do
            # Seal-2.0.1-arm64-v8a-release.apk -> Seal-v2.0.1-arm64-v8a.apk
            filename=$(basename "$apk_path" .apk)
            abi=${filename#Seal-$VERSION-}
            abi=${abi%-release}
            new_name="Seal-v${VERSION}-${abi}.apk"
            cp "$apk_path" "release-apks/$new_name"
            echo "Copied $apk_path -> release-apks/$new_name"
          done
          if [ -z "$(ls -A release-apks)" ]; then
            echo "::error::No APKs were built."
            exit 1
          fi
          cd release-apks
          sha256sum *.apk > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seal-v${{ steps.version.outputs.version_name }}
          path: release-apks/
          retention-days: 14

      - name: Create GitHub release & upload assets
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Seal ${{ steps.version.outputs.tag_name }}"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-apks/*.apk
            release-apks/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
